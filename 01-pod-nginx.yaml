# Hari 1 — Pod pertama. Pod = sekali pakai: dihapus, hilang, tidak kembali sendiri.
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: belajar
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi